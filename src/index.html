<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滁州夜市 · 串串摊</title>
<style>
:root{
  --bg:#16120d; --panel:#221b14; --card:#26201a; --line:#3a3025;
  --ink:#f3ead9; --muted:#a4917a; --lamp:#f2b441;
  --good:#4caf7d; --warn:#e6a23c; --bad:#e06a5b;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#2c241b;color:var(--ink);padding:9px 14px}
button.primary{background:linear-gradient(#f2b441,#e09b2d);border-color:#f2b441;color:#2a1d08;font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.32;cursor:not-allowed}
b{font-weight:700}
.mut{color:var(--muted)}
.ok{color:var(--good)}
.tag{font-size:12px;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 84px}
.page{display:none}
.page.on{display:block}
h2{margin:0 0 12px;font-size:17px}
h3{margin:16px 0 8px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* ── 开场页 ── */
#pg-open{max-width:420px;margin:0 auto;text-align:center;padding-top:8vh}
#pg-open .silhouette{height:150px;position:relative;margin-bottom:6px}
#pg-open h1{font-size:22px;margin:0 0 4px;letter-spacing:.06em}
#pg-open .place{color:var(--lamp);font-size:13px;letter-spacing:.2em;margin-bottom:22px}
#pg-open p{font-size:15px;line-height:2;margin:0 0 4px}
#pg-open .risk{font-size:12px;color:var(--muted);margin-top:14px}
#pg-open .primary{margin-top:26px;padding:14px 46px;font-size:17px}

/* ── 主场景页 ── */
header{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
header b{color:var(--ink);font-size:15px}
.prog{display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:13px;color:var(--muted)}
.prog .track{flex:1;height:8px;background:#2c241b;border-radius:4px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--bad);transition:width .3s}
.prog .fill.mid{background:var(--warn)}
.prog .fill.on{background:var(--good)}

.scene{position:relative;height:24vh;min-height:170px;border-radius:14px;overflow:hidden;
  background:linear-gradient(#141b2c 0%,#2a2135 48%,#3b2d22 100%)}
.lights{position:absolute;top:0;left:0;right:0;height:22px;
  background:radial-gradient(circle at 16px 10px,#ffcf7a 0 3px,rgba(255,207,122,.22) 4px,transparent 7px);
  background-size:32px 22px}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:#2b2119}
.table{position:absolute;bottom:30px;left:10%;right:10%;height:56px;background:linear-gradient(#7a5433,#5e3f26);border-radius:6px}
.pot{position:absolute;bottom:86px;left:20%;width:74px;height:40px;background:#332d29;border-radius:6px 6px 18px 18px;border-top:5px solid #4a443f}
.steam{position:absolute;bottom:128px;left:22%;width:60px;height:34px}
.steam i{position:absolute;bottom:0;width:6px;height:16px;background:rgba(255,255,255,.32);border-radius:4px;animation:steam 2.4s ease-in-out infinite}
.steam i:nth-child(1){left:6px}
.steam i:nth-child(2){left:26px;animation-delay:.8s}
.steam i:nth-child(3){left:46px;animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}
.skewers{position:absolute;bottom:88px;right:24%;width:46px;height:44px;transform:rotate(-7deg);
  background:repeating-linear-gradient(96deg,#d8b083 0 2px,transparent 2px 7px);
  transition:height .4s,opacity .4s}
.skewers::after{content:"";position:absolute;top:0;left:0;right:6px;height:26px;
  background:repeating-linear-gradient(96deg,#a8412f 0 6px,transparent 6px 13px)}
.skewers.empty{opacity:.18}
.guests{position:absolute;bottom:34px;left:14px;display:flex;gap:7px;align-items:flex-end}
.guest{position:relative;width:13px;height:15px;background:#b98d5c;border-radius:6px 6px 3px 3px}
.guest::before{content:"";position:absolute;top:-9px;left:1px;width:11px;height:11px;border-radius:50%;background:#e3bd93}
.guest.b{background:#7d8fa5}
.rival{position:absolute;bottom:34px;right:8px;width:78px;height:58px;background:#221a13;border-radius:6px;display:none;border-top:5px solid #4a3b28}
.rival::after{content:"隔壁摊";position:absolute;top:12px;left:0;right:0;text-align:center;font-size:10px;color:#8a7a63}
.rain{position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(78deg,transparent 0 9px,rgba(190,215,255,.28) 9px 10px);
  animation:rainmove .45s linear infinite}
.rain.heavy{background-image:repeating-linear-gradient(78deg,transparent 0 5px,rgba(190,215,255,.42) 5px 6px)}
@keyframes rainmove{to{background-position:0 46px}}
.sky-tag{position:absolute;top:8px;left:10px;font-size:11px;color:#ecdcbc;background:rgba(0,0,0,.4);padding:2px 9px;border-radius:9px}
.cal-tag{position:absolute;top:8px;right:10px;font-size:11px;color:#f2b441;background:rgba(0,0,0,.4);padding:2px 9px;border-radius:9px}
.float{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-size:32px;font-weight:800;
  color:#ffcf7a;text-shadow:0 2px 10px rgba(0,0,0,.65);opacity:0;pointer-events:none;white-space:nowrap}
.float.go{animation:floatUp 1.45s ease-out}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,16px)}22%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.scene .note{position:absolute;left:0;right:0;bottom:0;background:rgba(12,9,6,.74);font-size:12px;
  color:#efe3cd;padding:7px 11px;border-radius:0 0 14px 14px}

/* ── 军师 + 老摊主 ── */
.mentor-row{display:flex;gap:9px;margin:12px 0 14px;align-items:flex-start}
.mentor-row .who{flex:none;width:34px;height:34px;border-radius:50%;background:#3a2f22;color:var(--lamp);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.mentor-row .who.old{background:#2f2620;color:#c9a678}
.mentor-row p{margin:0;background:#2a221a;border:1px solid #463a2b;border-radius:4px 12px 12px 12px;
  padding:8px 11px;font-size:13px;line-height:1.55;flex:1}
.mentor-row p em{color:var(--lamp);font-style:normal;font-weight:700}
.mentor-row p .guessed{color:var(--warn);font-style:italic}

/* ── 押注决策板 ── */
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.board .fc-line{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.board .fc-line .fc-big{font-size:26px;font-weight:800;color:var(--lamp);font-variant-numeric:tabular-nums}
.board .fc-line .fc-cap{font-size:12px;color:var(--muted)}
.board .intel{font-size:12px;color:var(--muted);margin:2px 0 12px;line-height:1.6}
.board .intel b{color:var(--ink)}

.bet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.bet-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:11px 4px;min-height:96px;background:var(--card);border-radius:12px;
  border:1px solid var(--line);transition:border-color .15s,transform .1s;position:relative;overflow:hidden}
.bet-btn b{font-size:20px;line-height:1.1}
.bet-btn small{font-size:11px;color:var(--muted);margin-top:3px}
.bet-btn span{font-size:11px;color:var(--lamp);margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.bet-btn:hover:not(:disabled){border-color:var(--lamp);transform:translateY(-1px)}
.bet-btn:disabled{opacity:.32;cursor:not-allowed}
.bet-btn.danger b{color:var(--bad)}
.bet-btn.covered{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp) inset}
.bet-btn.covered::before{content:"军师区间";position:absolute;top:2px;left:4px;font-size:9px;
  color:#2a1d08;background:var(--lamp);padding:1px 5px;border-radius:6px;font-weight:700}

/* ── 定价滑杆 ── */
.price-block{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.price-block .p-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:6px}
.price-block .p-head b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.slider-wrap{position:relative;padding:6px 0 4px}
.slider-wrap input[type=range]{width:100%;-webkit-appearance:none;background:transparent;margin:0}
.slider-wrap input[type=range]::-webkit-slider-runnable-track{height:6px;background:#2c241b;border-radius:3px}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--lamp);margin-top:-8px;border:2px solid #2a1d08;cursor:pointer}
.slider-wrap input[type=range]::-moz-range-track{height:6px;background:#2c241b;border-radius:3px}
.slider-wrap input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:var(--lamp);border:2px solid #2a1d08;cursor:pointer}
.slider-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--good);pointer-events:none;transition:left .1s}
.slider-mark::after{content:"本地均价";position:absolute;top:-16px;left:-24px;font-size:10px;color:var(--good);white-space:nowrap}
.slider-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px}

.skip-btn{width:100%;margin-top:12px;padding:10px;font-size:12px;background:transparent;color:var(--muted);
  border:1px dashed var(--line);border-radius:10px}
.skip-btn:hover:not(:disabled){color:var(--warn);border-color:var(--warn)}

.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}

/* ── 开奖归因 ── */
.result-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.attr-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:10px}
.attr-row>div{font-size:12px;color:var(--muted)}
.attr-row b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.attr-row .win b{color:var(--good)}
.attr-row .lose b{color:var(--bad)}
.compare{margin:6px 0;padding:8px 10px;background:#1c1610;border-radius:8px;font-size:12px;line-height:1.7;color:var(--muted)}
.compare b{color:var(--ink)}
.compare .warn{color:var(--warn)}
.compare .good{color:var(--good)}
.compare .bad{color:var(--bad)}
.attr-detail{text-align:center;font-size:13px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.7}
.attr-detail .num{color:var(--lamp);font-weight:700;font-variant-numeric:tabular-nums}
.attr-detail .bad{color:var(--bad)}
.attr-detail .good{color:var(--good)}

/* ── 底部抽屉 ── */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);
  display:flex;gap:8px;padding:9px 12px;background:#1a140e;border-top:1px solid var(--line);z-index:7}
.tabs button{flex:1;font-size:14px}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,115%);width:min(560px,100%);
  background:#1e1811;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:16px;max-height:64vh;overflow:auto;transition:transform .25s;z-index:9}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{padding:3px 10px;font-size:12px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.srow:last-child{border-bottom:0}
.srow.total{border-top:1px solid var(--line);border-bottom:0;font-weight:700;font-size:15px;padding-top:10px}
.srow .num{font-variant-numeric:tabular-nums;font-weight:600}
.grow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.grow:last-child{border-bottom:0}
.logs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.logs .log{font-size:12px;padding:5px 8px;border-radius:6px;background:#282019;margin-bottom:5px}
.logs .log span{color:var(--muted);margin-right:7px;font-size:11px}
.logs .log.good{background:#1f2b23}
.logs .log.warn{background:#2e2517}
.logs .log.bad{background:#2e1c19}

/* ── 周结算页 ── */
.wk{max-width:420px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.wk-track{height:14px;background:#2c241b;border-radius:7px;overflow:hidden;margin:14px 0 6px}
.wk-fill{height:100%;background:var(--bad);width:0;transition:width .4s}
.wk-fill.mid{background:var(--warn)}
.wk-fill.on{background:var(--good)}
.wk-cap{font-size:12px;color:var(--muted);text-align:right}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.acts button{padding:11px 22px}

/* ── 结局页 ── */
.end{max-width:420px;margin:0 auto;text-align:center;padding-top:7vh}
.end h1{font-size:30px;margin:0 0 16px;letter-spacing:.06em}
.end h1.good{color:var(--good)}
.end h1.warn{color:var(--warn)}
.end h1.bad{color:var(--bad)}
.end .line{font-size:15px;margin:5px 0}
.end .quote{margin:26px 0 8px;font-size:15px;line-height:1.9;color:var(--lamp)}
.end .acts{justify-content:center}

/* ── 复盘页 ── */
.rc-head{font-size:16px;color:var(--lamp);margin:4px 0 14px;font-variant-numeric:tabular-nums}
.rc-row{display:flex;align-items:center;gap:10px;font-size:12px;margin:7px 0;color:var(--muted)}
.rc-row .w{width:44px}
.rc-track{flex:1;height:11px;background:#2c241b;border-radius:6px;overflow:hidden}
.rc-fill{height:100%;background:var(--warn)}
.rc-fill.hi{background:var(--bad)}
.rc-fill.lo{background:var(--good)}
.rc-row .v{width:48px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rc-curve{font-family:monospace;font-size:11px;color:var(--lamp);line-height:1.7;margin:10px 0;
  white-space:pre;overflow-x:auto;background:#1a140e;padding:10px;border-radius:8px}
.rc-curve .lbl{color:var(--muted)}
#rc-marks{list-style:none;margin:0;padding:0}
#rc-marks li{font-size:13px;padding:7px 10px;background:var(--card);border-radius:8px;margin-bottom:6px}
.rc-quote{margin-top:18px;font-size:14px;color:var(--lamp);line-height:1.8}

/* ── 弹层 ── */
#overlay{position:fixed;inset:0;background:rgba(10,8,5,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:480px;width:100%;
  padding:18px;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:16px;color:var(--ink);letter-spacing:0}
.modal p{margin:6px 0;font-size:14px}
.modal .acts{margin-top:16px}
.opt{display:block;width:100%;text-align:left;margin-top:9px;padding:11px 13px;background:var(--card)}
.opt:hover{border-color:var(--lamp)}
.opt b{display:block;margin-bottom:3px;font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.modal table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.modal th,.modal td{padding:4px 2px;text-align:center;border-bottom:1px solid var(--line)}
.vbtn{padding:3px 7px;margin:1px;font-size:12px;border-radius:6px;background:#2c241b}
.vbtn.on{background:var(--lamp);border-color:var(--lamp);color:#2a1d08;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <section class="page" id="pg-open">
    <div class="silhouette">
      <div class="pot" style="bottom:76px;left:34%"></div>
      <div class="steam" style="bottom:120px;left:36%"><i></i><i></i><i></i></div>
      <div class="skewers" style="bottom:78px;right:30%"></div>
      <div class="table" style="bottom:20px;left:14%;right:14%"></div>
    </div>
    <h1>滁州夜市 · 串串摊</h1>
    <div class="place">开 张</div>
    <p>你揣着 2 万块，想在夜市摆个串串摊。</p>
    <p>28 天，日均 150 签，做到就站稳了。</p>
    <p>每天你押一注，每晚夜市开奖。</p>
    <p>一个 AI 军师和一个老摊主说要帮你。</p>
    <div class="risk">现金见底就收摊。开局明示，没有退路。</div>
    <button class="primary" id="b-start">出摊</button>
  </section>

  <section class="page" id="pg-main">
    <header>
      <span id="h-day"></span>
      <span id="h-cash"></span>
    </header>
    <div class="prog">
      <span id="h-avg"></span>
      <span class="track"><span class="fill" id="h-fill"></span></span>
    </div>

    <div class="scene" id="scene">
      <div class="lights"></div>
      <div class="sky-tag" id="sc-weather"></div>
      <div class="cal-tag" id="sc-cal" style="display:none"></div>
      <div class="ground"></div>
      <div class="table"></div>
      <div class="pot"></div>
      <div class="steam"><i></i><i></i><i></i></div>
      <div class="skewers" id="sc-skewers"></div>
      <div class="guests" id="sc-guests"></div>
      <div class="rival" id="sc-rival"></div>
      <div class="rain" id="sc-rain" style="display:none"></div>
      <div class="float" id="float"></div>
      <div class="note" id="sc-note"></div>
    </div>

    <div class="mentor-row">
      <div class="who">军师</div>
      <p id="adv-line"></p>
    </div>
    <div class="mentor-row" id="old-row">
      <div class="who old">摊主</div>
      <p id="old-line"></p>
    </div>

    <!-- 押注态 -->
    <div id="phase-bet">
      <div class="board">
        <div class="fc-line">
          <span class="fc-big" id="b-fc">140±25</span>
          <span class="fc-cap">军师今晚预测</span>
        </div>
        <div class="intel" id="b-intel"></div>

        <div class="bet-grid" id="bet-grid">
          <button class="bet-btn" data-amount="80"><b>80</b><small>保守</small><span id="cost-80">¥96</span></button>
          <button class="bet-btn" data-amount="120"><b>120</b><small>稳</small><span id="cost-120">¥144</span></button>
          <button class="bet-btn" data-amount="160"><b>160</b><small>攻</small><span id="cost-160">¥192</span></button>
          <button class="bet-btn danger" data-amount="200"><b>200</b><small>赌</small><span id="cost-200">¥240</span></button>
        </div>

        <div class="price-block">
          <div class="p-head">
            <span>定价 <b id="p-val">3.0</b> 元/签</span>
            <span id="p-ref" class="mut">本地价格带：未知</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="p-slider" min="70" max="130" value="100" step="1">
            <div class="slider-mark" id="p-mark" style="display:none;left:50%"></div>
          </div>
          <div class="slider-scale"><span>2.1</span><span>3.0</span><span>3.9</span></div>
        </div>

        <button class="skip-btn" id="b-skip">今天不押 · 亏 ¥80 固定成本，去拿个数</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <!-- 开奖态 -->
    <div id="phase-result" style="display:none">
      <div class="result-panel">
        <div class="attr-row" id="r-attrs">
          <div>押 <b id="r-bet">-</b></div>
          <div>需 <b id="r-demand">-</b></div>
          <div id="r-left-box">剩 <b id="r-left">-</b></div>
        </div>
        <div class="compare" id="r-compare"></div>
        <div class="attr-detail" id="r-detail"></div>
      </div>
      <div class="acts" style="margin-top:12px">
        <button class="primary" id="b-next" style="width:100%">收摊</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tab-ledger">账本</button>
      <button id="tab-gaps">缺口</button>
    </div>

    <div class="sheet" id="sh-ledger">
      <h3>账本 <button data-close="sh-ledger">收起</button></h3>
      <div id="ld-body"></div>
    </div>
    <div class="sheet" id="sh-gaps">
      <h3>缺口 <button data-close="sh-gaps">收起</button></h3>

    <div class="wk">
      <h2 id="wk-title"></h2>
      <div id="wk-rows"></div>

    <div class="end">
      <h1 id="end-title"></h1>
      <p class="line" id="end-a"></p>

        <button class="primary" id="b-again1">再来一局</button>

    <div class="end" style="text-align:left;padding-top:24px">
      <h2>这 28 天</h2>

      <p class="rc-head" id="rc-head"></p>
      <div id="rc-chart"></div>
      <h3>三条线</h3>
      <div class="rc-curve" id="rc-curve"></div>
      <h3>关键转折</h3>
      <ul id="rc-marks"></ul>
      <p class="rc-quote">游戏里蹲两晚就能回填缺口----滁州的夜市也是。</p>
      <div class="acts"><button class="primary" id="b-again2">再来一局</button></div>
    </div>
  </section>

</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

/* ── 常量 ── */
const L = {
  days: 28, target: 150, start: 20000, bottom: 0, wasteCap: 0.10,
  probe: 150, blind: 80,
  unitCost: 1.2, priceBase: 3.0, localAvg: 3.2,
  fixed: 80,
  fine: 200, loan: 8000, loanInt: 400,
};
const GAPS = [
  { key: 'price',   label: '本地价格带', src: '探店', how: '看隔壁摊都卖多少钱' },
  { key: 'crowd',   label: '真实客流',   src: '探店', how: '数一晚过路的人和翻台' },
  { key: 'mix',     label: '品类偏好',   src: '探店', how: '看客人点荤多还是点素多' },
  { key: 'broth',   label: '底料冠军',   src: '盲测', how: '五款盲打分，选出冠军' },
  { key: 'weekAvg', label: '实测日均',   src: '自动', how: '第一周结算回填' },
  { key: 'waste',   label: '实际损耗',   src: '自动', how: '第一周结算回填' },
];
const CAL_EVENTS = {
  6: '周六 · 周末夜', 7: '周日 · 收摊早', 13: '周六 · 周末夜', 14: '周日 · 收摊早',
  15: '琅琊山 · 游客高峰', 20: '周六 · 周末夜', 21: '周日 · 收摊早',
  22: '女山湖 · 大闸蟹到货', 27: '周六 · 周末夜', 28: '月末决算'
};

let S;
const g = (k) => S.gaps[k];

/*
  状态机（唯一真源）：
    S.phase: 'bet'    → 玩家可以押注 / 不押
              'result' → 今天已开奖，等玩家点「收摊」
    S.pendingBet: 弹窗中等待确认的押注金额（null 表示没有待办）
  没有 S.busy。
*/
function reset() {
  S = {
    day: 1, cash: L.start, weather: rollWeather(),
    pricing: 'est', mix: [60, 30, 10], priceCut: false, quality: 1,
    priceMultiplier: 1.0,
    gaps: {}, records: [], logs: [], milestones: [],
    wasteSum: 0, wasteN: 0, weekViolations: 0, weekShortages: 0,
    wechat: 0, declines: 0, loans: 0, q: [], guests: 0,
    cum: { rev: 0, cost: 0, act: 0, event: 0 },
    fc: [{ v: L.target, u: 0 }, null, null, null],
    errors: [null, null, null, null],
    paidWeeks: {}, rivalDone: false, finished: false,
    lastResult: null, stall: null, phase: 'bet', pendingBet: null,
    fcHistory: [], betHistory: [], demandHistory: [],
    oldGuess: null,
  };
  GAPS.forEach((x) => { S.gaps[x.key] = { filled: false, val: null, day: null }; });
  log('第 1 天：设备与货置办妥了，手里现金 20,000。', '');
}

const fmt = (n) => Math.round(n).toLocaleString('zh-CN');
const money = (n) => '¥' + fmt(n);

function multCore() {
  let m = g('price').filled ? 1.05 : 0.78;
  if (g('crowd').filled) m *= 1.15;
  if (g('broth').filled) m *= S.quality;
  return m;
}
function forecast() {
  return { v: Math.round(L.target * multCore()), u: unc() };
}
function oldMasterEstimate() {
  // 老摊主：一个点估计，比军师偏差大，但有自己偏向
  const f = forecast();
  const bias = (Math.random() * 0.2 - 0.1);   // -10% ~ +10%
  const cal = CAL_EVENTS[S.day];
  let mod = 1;
  if (cal && cal.indexOf('周末') >= 0) mod = 1.1;
  if (cal && cal.indexOf('游客高峰') >= 0) mod = 1.15;
  return Math.max(40, Math.round(f.v * (1 + bias) * mod));
}
function actualDemand() {
  const f = forecast();
  const half = f.u / 100;
  const r = (Math.random() * 2 - 1) * half;
  let d = f.v * (1 + r);
  if (S.weather === '小雨') d *= 0.82;
  else if (S.weather === '暴雨') d *= 0.5;
  else if (S.weather === '阴') d *= 0.95;
  const cal = CAL_EVENTS[S.day];
  if (cal) {
    if (cal.indexOf('周末') >= 0) d *= 1.2;
    if (cal.indexOf('游客高峰') >= 0) d *= 1.35;
    if (cal.indexOf('大闸蟹') >= 0) d *= 1.15;
  }
  if (S.q.length) d *= S.q.shift();
  if (S.wechat < 15) d *= 0.92;
  // 定价弹性：每 +10% 价格，需求 -6%
  d *= (1 - (S.priceMultiplier - 1) * 0.6);
  // 价格带未实测：玩家在黑箱中定价，需求方差更大
  if (!g('price').filled) d *= (0.92 + Math.random() * 0.16);
  return Math.max(10, Math.round(d));
}
function currentPrice() {
  return L.priceBase * S.priceMultiplier;
}
function progress() {
  const stalls = S.records.filter((r) => r.act === '押注');
  const total = stalls.reduce((a, r) => a + r.sold, 0);
  return { played: stalls.length, total, avg: stalls.length ? total / stalls.length : 0 };
}
const filledCount = () => GAPS.filter((x) => g(x.key).filled).length;
const manualFilled = () => GAPS.filter((x) => x.src !== '自动' && g(x.key).filled).length;
const unc = () => [40, 30, 20, 12, 8][manualFilled()];
function rollWeather() {
  const r = Math.random();
  return r < 0.5 ? '晴' : r < 0.8 ? '阴' : r < 0.93 ? '小雨' : '暴雨';
}
const canBet = () => S.phase === 'bet' && !S.finished;

function log(text, cls) {
  S.logs.unshift({ day: S.day, text, cls: cls || '' });
  if (S.logs.length > 40) S.logs.pop();
}
const mark = (t) => S.milestones.push(t);

function openModal(html, btns) {
  let tail = '';
  if (btns) {
    tail = '<div class="acts">' + btns.map((b, i) =>
      '<button data-i="' + i + '" class="' + (b.cls || '') + '">' + b.label + '</button>').join('') + '</div>';
  }
  $('modal').innerHTML = html + tail;
  if (btns) btns.forEach((b, i) => { $('modal').querySelector('button[data-i="' + i + '"]').onclick = b.fn; });
  $('overlay').classList.add('on');
}
const closeModal = () => $('overlay').classList.remove('on');

/* ─── 押注入口 ─── */
function doBet(amount) {
  if (!canBet()) return;
  if ($('overlay').classList.contains('on')) return;
  if (S.cash < amount * L.unitCost) return;

  // 对手降价（第 15 天脚本钉死）
  if (!S.rivalDone && S.day >= 15) {
    S.rivalDone = true;
    S.pendingBet = { amount };
    openRival();
    return;
  }

  const ev = rollEvent();
  if (ev && ev.kind === 'choice') {
    S.pendingBet = { amount, ev };
    openChoice(ev);
    return;
  }

  let mult = 1;
  if (ev && ev.kind === 'auto') {
    if (ev.next) S.q.push(ev.next);
    if (ev.wechat) S.wechat += ev.wechat;
    log(ev.label + '：' + ev.text, ev.cls || '');
    mult = ev.mult;
  }
  resolveBet(amount, mult);
}

/* ─── 结算（唯一出口） ─── */
function resolveBet(amount, mult) {
  S.pendingBet = null;
  S.phase = 'result';
  S.stall = null;

  if (S.cash < amount * L.unitCost) {
    amount = Math.max(0, Math.floor(S.cash / L.unitCost));
  }

  if (amount === 0) {
    S.cash -= L.fixed;
    S.cum.cost += L.fixed;
    S.lastResult = { kind: 'skip', day: S.day, text: '现金见底，今天没出摊。' };
    S.fcHistory.push(forecast().v);
    S.betHistory.push(0);
    S.demandHistory.push(0);
    S.records.push({ day: S.day, act: '押注', sold: 0, bet: 0, demand: 0, leftover: 0, shortage: 0, rev: 0, cost: L.fixed });
    renderMain();
    return;
  }

  const cost = amount * L.unitCost;
  S.cash -= cost;
  S.cum.cost += cost;

  const fc = forecast().v;
  const demand = Math.max(0, Math.round(actualDemand() * (mult == null ? 1 : mult)));
  const sold = Math.min(amount, demand);
  const leftover = Math.max(0, amount - demand);
  const shortage = Math.max(0, demand - amount);
  const price = currentPrice();
  const rev = sold * price;
  const net = rev - cost - L.fixed;

  S.cash += rev - L.fixed;
  S.cum.rev += rev;
  S.cum.cost += L.fixed;

  S.wechat += Math.min(5, Math.round(sold / 30));
  S.guests = Math.max(0, Math.min(9, Math.round(sold / 22)));

  S.fcHistory.push(fc);
  S.betHistory.push(amount);
  S.demandHistory.push(demand);

  const wasteRate = amount > 0 ? leftover / amount : 0;
  S.wasteSum += wasteRate; S.wasteN += 1;
  let fine = 0;
  if (wasteRate > L.wasteCap) {
    S.weekViolations += 1;
    fine = L.fine;
    S.cash -= fine;
    S.cum.event += fine;
  }
  if (shortage > 0) S.weekShortages += 1;

  S.records.push({
    day: S.day, act: '押注', sold, bet: amount, demand, leftover, shortage, rev, cost
  });
  S.stall = { amount, demand, sold, leftover, shortage, rev, cost, net, wasteRate, fine, fc };
  S.lastResult = { kind: 'stall', day: S.day, ...S.stall };

  log(
    '押 ' + amount + ' → 需 ' + demand + ' → 售 ' + sold +
    (shortage ? '（断货 ' + shortage + '）' : '') +
    '，流水 ' + money(rev) + '，净 ' + money(net),
    shortage ? 'warn' : (sold >= amount ? 'good' : '')
  );

  renderMain();
  showFloat('+' + sold + '签');
}

/* ─── 事件 ─── */
function rollEvent() {
  if (S.day === 1) return null;                 // 第 1 天强制出摊，不触发事件
  if (Math.random() > 0.30) return null;
  const pool = [];
  if (S.weather === '小雨') pool.push({ kind: 'auto', mult: 1, label: '小雨', text: '雨天客流少，但老客照来。', cls: '' });
  if (S.weather === '暴雨') pool.push({ kind: 'auto', mult: 1, label: '暴雨', text: '雨太大，街上没剩几个人。', cls: 'warn' });
  pool.push({ kind: 'auto', mult: 0.4, label: '商圈改造', text: '前方施工围挡，今天客流腰斩。', cls: 'warn' });
  pool.push({ kind: 'auto', mult: 1, next: 1.05, wechat: 5, label: '熟客推荐',
    text: '熟客带朋友来，加了 5 个微信，明晚多来些人。', cls: 'good' });
  pool.push({
    kind: 'choice', label: '设备故障', text: '卡式炉点不着火，串好的签等着下锅。',
    options: [
      { label: '找师傅修', sub: '花 700 元，必成', fn() {
        S.cash -= 700; S.cum.event += 700; log('维修花了 700 元，当天照常出摊。', '');
      }},
      { label: '自己捣鼓', sub: '六成花 300 修好；四成花 800 还得叫师傅', fn() {
        if (Math.random() < 0.6) { S.cash -= 300; S.cum.event += 300; log('自己修好了，只花 300 元零件。', 'good'); }
        else { S.cash -= 800; S.cum.event += 800; log('没修好，还是叫了师傅，花 800。', 'bad'); }
      }},
    ],
  });
  pool.push({
    kind: 'choice', label: '恶意差评', text: '有人说「又贵又难吃」，还发了帖。',
    options: [
      { label: '诚恳回复并补偿', sub: '花 100 元，帖子不扩大', fn() {
        S.cash -= 100; S.cum.event += 100; log('回复加一份补偿，帖子没有扩散。', 'good');
      }},
      { label: '冷处理', sub: '明晚客流 -15%', fn() {
        S.q.push(0.85); log('帖子发酵，明晚客流受影响。', 'bad');
      }},
    ],
  });
  if (S.cash < 5000 && S.loans < 1) {
    pool.push({
      kind: 'choice', label: '现金吃紧', text: '有人递来「周转贷」。',
      options: [
        { label: '借 ' + money(L.loan), sub: '每周利息 400，本金不还', fn() {
          S.cash += L.loan; S.loans += 1;
          mark('第' + S.day + '天 你借了周转贷');
          log('借了 8,000 元，每周多一笔 400 利息。', 'bad');
        }},
        { label: '不借，收缩过日子', sub: '每步用上一步的利润', fn() { log('不借钱。', ''); }},
      ],
    });
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function openChoice(ev) {
  openModal(
    '<h3>' + ev.label + '</h3><p>' + ev.text + '</p>' +
    ev.options.map((o, i) =>
      '<button class="opt" data-o="' + i + '"><b>' + o.label + '</b><span>' + o.sub + '</span></button>').join(''),
    null
  );
  $('modal').querySelectorAll('button[data-o]').forEach((b) => {
    b.onclick = () => {
      ev.options[Number(b.dataset.o)].fn();
      closeModal();
      const amt = S.pendingBet ? S.pendingBet.amount : 120;
      resolveBet(amt, 1);
    };
  });
}

function openRival() {
  openModal(
    '<h3>对手降价</h3><p>隔壁新来了个摊，素签直接降到 3 毛，有人来问你跟不跟。</p>' +
    '<button class="opt" data-o="0"><b>守价，推套餐应对</b><span>明晚客流 +5%，价格不丢</span></button>' +
    '<button class="opt" data-o="1"><b>跟降 15%</b><span>签价永久 -15%：明晚多来人，随后三天老客流失</span></button>',
    null
  );
  $('modal').querySelectorAll('button[data-o]').forEach((b) => {
    b.onclick = () => {
      if (Number(b.dataset.o) === 0) {
        S.q.push(1.05);
        log('守住价格，推套餐应对，明晚客流 +5%。', 'good');
        mark('第' + S.day + '天 你守住了价格');
      } else {
        S.declines += 1; S.priceCut = true; S.q.push(1.25, 0.9, 0.85, 0.8);
        log('跟降 15%：明晚多来人，之后三天老客流失。', 'bad');
        mark('第' + S.day + '天 你跟了降价----三天老客流失');
      }
      closeModal();
      const amt = S.pendingBet ? S.pendingBet.amount : 160;
      resolveBet(amt, 1);
    };
  });
}

/* ─── 今天不押 ─── */
function doSkip() {
  if (!canBet() || S.day === 1) return;
  if ($('overlay').classList.contains('on')) return;
  const probeLeft = GAPS.filter((x) => x.src === '探店' && !g(x.key).filled);
  const blindLeft = !g('broth').filled;
  const opts = [];
  if (probeLeft.length) opts.push({ k: 'probe', label: '探店调研', sub: money(L.probe) + ' · 换回一条实测' });
  if (blindLeft) opts.push({ k: 'blind', label: '底料盲测', sub: money(L.blind) + ' · 选出冠军料' });
  if (!opts.length) {
    openModal('<h3>没得可拿了</h3><p>该探的都探完了。今天只能押注。</p>',
      [{ label: '好', fn: closeModal }]);
    return;
  }
  openModal(
    '<h3>今天不押</h3><p class="tag">这一天没有营收，固定成本 ' + money(L.fixed) + ' 照扣。</p>' +
    opts.map((o, i) => '<button class="opt" data-o="' + i + '"><b>' + o.label + '</b><span>' + o.sub + '</span></button>').join(''),
    [{ label: '再想想', fn: closeModal }]
  );
  $('modal').querySelectorAll('button[data-o]').forEach((b) => {
    b.onclick = () => {
      closeModal();
      const o = opts[Number(b.dataset.o)];
      if (o.k === 'probe') openProbePicker(); else openBlind();
    };
  });
}

function openProbePicker() {
  if (!canBet()) return;
  const left = GAPS.filter((x) => x.src === '探店' && !g(x.key).filled);
  if (!left.length) return;
  if (S.cash < L.probe) {
    openModal('<h3>现金不够</h3><p>探店要 ' + money(L.probe) + '，你现在只有 ' + money(S.cash) + '。</p>',
      [{ label: '知道了', fn: closeModal }]);
    return;
  }
  openModal(
    '<h3>探店调研</h3><p class="tag">花 ' + money(L.probe) + '，今天不出摊，换回一条实测。</p>' +
    left.map((x) => '<button class="opt" data-k="' + x.key + '"><b>' + x.label + '</b><span>' + x.how + '</span></button>').join(''),
    [{ label: '再想想', fn: closeModal }]
  );
  $('modal').querySelectorAll('button[data-k]').forEach((b) => {
    b.onclick = () => { closeModal(); fillProbe(b.dataset.k); };
  });
}

function fillProbe(key) {
  if (!canBet()) return;
  const def = GAPS.find((x) => x.key === key);
  const gap = g(key);
  if (!def || def.src !== '探店' || gap.filled || S.cash < L.probe) return;

  S.phase = 'result';
  S.stall = null;
  gap.filled = true; gap.day = S.day;
  S.cash -= L.probe; S.cum.act += L.probe;
  S.cash -= L.fixed; S.cum.cost += L.fixed;

  if (key === 'price') { S.pricing = 'locked'; gap.val = '本地均价 3.2 元'; }
  else if (key === 'crowd') { gap.val = '接待上限 +15%'; }
  else if (key === 'mix') { S.mix = [55, 35, 10]; gap.val = '55 : 35 : 10'; }

  S.records.push({ day: S.day, act: '探店', sold: 0, bet: 0, demand: 0, leftover: 0, shortage: 0, rev: 0, cost: L.probe + L.fixed });
  S.lastResult = { kind: 'probe', day: S.day, text: '探店：带回「' + def.label + '」实测' };
  S.fcHistory.push(forecast().v);
  S.betHistory.push(0);
  S.demandHistory.push(0);
  log('探店回填「' + def.label + '」：' + gap.val + '。', 'good');
  mark('第' + S.day + '天 你去探了店');

  renderMain();
  showFloat('实测到手');
}

function openBlind() {
  if (!canBet()) return;
  if (g('broth').filled) return;
  if (S.cash < L.blind) {
    openModal('<h3>现金不够</h3><p>盲测要 ' + money(L.blind) + '，你现在只有 ' + money(S.cash) + '。</p>',
      [{ label: '知道了', fn: closeModal }]);
    return;
  }
  const names = ['A', 'B', 'C', 'D', 'E'];
  const crit = ['闻香', '耐煮', '回甘'];
  const sc = {}; names.forEach((n) => { sc[n] = {}; });
  openModal(
    '<h3>底料盲测</h3><p class="tag">花 ' + money(L.blind) + '，今天不出摊。五款编号，三个维度各打 1–5 分。</p>' +
    '<table><tr><th>编号</th>' + crit.map((c) => '<th>' + c + '</th>').join('') + '<th>合计</th></tr>' +
    names.map((n) => '<tr><td><b>' + n + '</b></td>' +
      crit.map((c) => '<td>' + [1, 2, 3, 4, 5].map((v) =>
        '<button class="vbtn" data-n="' + n + '" data-c="' + c + '" data-v="' + v + '">' + v + '</button>').join('') +
        '</td>').join('') +
      '<td id="sum-' + n + '">–</td></tr>').join('') +
    '</table><p class="tag" id="blind-msg">五款全部打完才能提交。</p>',
    [{ label: '放弃', fn: closeModal }, { label: '提交评分', cls: 'primary', fn: submitBlind }]
  );
  $('modal').querySelectorAll('.vbtn').forEach((b) => {
    b.onclick = () => {
      const n = b.dataset.n, c = b.dataset.c, v = Number(b.dataset.v);
      sc[n][c] = v;
      $('modal').querySelectorAll('.vbtn[data-n="' + n + '"][data-c="' + c + '"]').forEach((x) => {
        x.classList.toggle('on', Number(x.dataset.v) === v);
      });
      const done = crit.every((k) => sc[n][k]);
      const sum = crit.reduce((a, k) => a + (sc[n][k] || 0), 0);
      $('sum-' + n).textContent = done ? sum + ' / 15' : '–';
    };
  });

  function submitBlind() {
    if (names.some((n) => crit.some((c) => !sc[n][c]))) {
      $('blind-msg').textContent = '还有款没打完分。';
      return;
    }
    if (!canBet()) return;

    S.phase = 'result';
    S.stall = null;
    const totals = names.map((n) => crit.reduce((a, c) => a + sc[n][c], 0));
    const best = Math.max.apply(null, totals);
    const champ = names[totals.indexOf(best)];
    S.quality = 1.08 + (best / 15) * 0.07;
    const gap = g('broth');
    gap.filled = true; gap.day = S.day;
    gap.val = champ + ' 款（' + best + '/45）';
    S.cash -= L.blind; S.cum.act += L.blind;
    S.cash -= L.fixed; S.cum.cost += L.fixed;

    S.records.push({ day: S.day, act: '盲测', sold: 0, bet: 0, demand: 0, leftover: 0, shortage: 0, rev: 0, cost: L.blind + L.fixed });
    S.lastResult = { kind: 'blind', day: S.day, text: '盲测：' + champ + ' 款胜出，底料系数 ' + S.quality.toFixed(2) };
    S.fcHistory.push(forecast().v);
    S.betHistory.push(0);
    S.demandHistory.push(0);
    log('盲测：冠军 ' + champ + ' 款（' + best + '/45），底料系数 ' + S.quality.toFixed(2) + '。', 'good');
    mark('第' + S.day + '天 你盲测出冠军料');

    closeModal();
    renderMain();
    showFloat('冠军 ' + champ + ' 款');
  }
}

/* ─── 回合推进 ─── */
function showFloat(text) {
  const fl = $('float');
  fl.textContent = text;
  fl.classList.remove('go');
  void fl.offsetWidth;
  fl.classList.add('go');
}

function nextDay() {
  if (S.finished) return;
  if (S.phase !== 'result') return;
  if (S.cash <= L.bottom) { renderEnding('bust'); show('pg-ending'); return; }
  if (S.day % 7 === 0) { renderWeekly(); show('pg-weekly'); return; }
  advanceDay();
}

function advanceDay() {
  S.day += 1;
  S.weather = rollWeather();
  S.phase = 'bet';
  S.pendingBet = null;
  S.stall = null;
  S.guests = 0;
  S.oldGuess = oldMasterEstimate();

  const w = Math.ceil(S.day / 7);
  if (S.fc[w - 1] == null) {
    S.fc[w - 1] = { v: Math.round(L.target * multCore()), u: unc() };
  }

  show('pg-main');
  renderMain();
}

function weekStats(w) {
  const from = (w - 1) * 7 + 1, to = w * 7;
  const rs = S.records.filter((r) => r.day >= from && r.day <= to);
  const stalls = rs.filter((r) => r.act === '押注' && r.bet > 0);
  const soldSum = stalls.reduce((a, r) => a + r.sold, 0);
  const betSum = stalls.reduce((a, r) => a + r.bet, 0);
  const demandSum = stalls.reduce((a, r) => a + r.demand, 0);
  const acc = stalls.length && demandSum > 0
    ? Math.max(0, 1 - Math.abs(betSum - demandSum) / demandSum) : null;
  return {
    n: stalls.length,
    avg: stalls.length ? soldSum / stalls.length : null,
    acc,
    shortages: S.weekShortages,
  };
}

function renderWeekly() {
  const w = Math.ceil(S.day / 7);
  const st = weekStats(w);
  const f = S.fc[w - 1];
  const fc = f ? f.v : null;
  const err = (fc != null && st.avg != null) ? Math.round(Math.abs(fc - st.avg) / st.avg * 100) : null;
  S.errors[w - 1] = err;

  if (!S.paidWeeks[w]) {
    S.paidWeeks[w] = true;
    const interest = S.loans * L.loanInt;
    if (interest > 0) { S.cash -= interest; S.cum.event += interest; log('借款利息 ' + money(interest) + '。', 'bad'); }
    if (w === 1) {
      if (st.avg != null) { const gp = g('weekAvg'); gp.filled = true; gp.day = 7; gp.val = Math.round(st.avg) + ' 签'; }
      if (S.wasteN > 0) { const gp = g('waste'); gp.filled = true; gp.day = 7; gp.val = ((S.wasteSum / S.wasteN) * 100).toFixed(1) + '%'; }
    }
    S.weekShortages = 0;
    S.weekViolations = 0;
  }

  $('wk-title').textContent = '第 ' + w + ' 周 · 结算';
  const rows = [];
  rows.push(row('军师周一预测', fc == null ? '--' : fc + ' 签/天' + (f.u ? '（±' + f.u + '%）' : '（我很有把握）')));
  rows.push(row('实际出摊日均', st.avg == null ? '本周没押注' : st.avg.toFixed(0) + ' 签/天'));
  rows.push(row('备货准确率', st.acc == null ? '--' : Math.round(st.acc * 100) + '%'));
  rows.push(row('断货次数', String(st.shortages)));
  rows.push(row('现金', money(S.cash)));
  rows.push(row('缺口', (GAPS.length - filledCount()) + ' 个待回填'));
  $('wk-rows').innerHTML = rows.join('');

  const fill = $('wk-fill');
  if (err == null) {
    fill.style.width = '0%';
    $('wk-cap').textContent = '没有对照，谈不上误差';
  } else {
    fill.style.width = Math.min(100, err) + '%';
    fill.className = 'wk-fill' + (err > 30 ? '' : err > 15 ? ' mid' : ' on');
    const prev = w > 1 ? S.errors[w - 2] : null;
    let cap = '误差 ±' + err + '%';
    if (w === 1) cap += st.avg < fc ? '----说好的 150 呢' : '----我居然报少了';
    else if (prev != null) cap += err < prev ? '，比上周收窄 ' + (prev - err) + ' 个点' : '，比上周扩大 ' + (err - prev) + ' 个点';
    $('wk-cap').textContent = cap;
  }

  const firstUnfilled = GAPS.find((x) => x.src !== '自动' && !g(x.key).filled);
  let comment;
  if (S.cash <= L.bottom) comment = '现金见底，这局到头了。';
  else if (st.avg == null) comment = '一周没押注，什么都没验证。';
  else if (firstUnfilled) comment = '误差主要卡在「' + firstUnfilled.label + '」----你帮我拿到它，下周能压到 ±' + Math.max(8, unc() - 8) + '。';
  else comment = '数据齐了，我这边没什么可猜的了。';
  $('wk-comment').textContent = '军师：' + comment;

  $('b-wk').textContent = S.day >= 28 ? '查看结局' : '进入第 ' + (w + 1) + ' 周';
}

const row = (k, v) => '<div class="srow"><span>' + k + '</span><span class="num">' + v + '</span></div>';

function weeklyNext() {
  if (S.day >= 28) {
    renderEnding(S.cash <= L.bottom ? 'bust' : null);
    show('pg-ending');
    return;
  }
  advanceDay();
}

/* ─── 结局 ─── */
function renderEnding(kind) {
  S.finished = true;
  const p = progress();
  const filled = filledCount();
  let title, quote, cls;
  if (kind === 'bust') {
    title = '触底出局';
    quote = '现金见底，这局到此为止。下局先活下来。';
    cls = 'bad';
  } else {
    const pass = p.avg >= L.target;
    const ready = filled >= 5;
    if (pass && ready) { title = '你心里有数'; quote = '军师的模型，你的数字----这摊子，是你的了'; cls = 'good'; }
    else if (pass && !ready) { title = '运气替你付了学费'; quote = '这局的赢和你的判断没关系'; cls = 'warn'; }
    else if (!pass && ready) { title = '数字对了，执行输了'; quote = '赔率算对了，最后还是押错档'; cls = 'warn'; }
    else { title = '你全程在赌'; quote = '你不知道自己在赌什么'; cls = 'bad'; }
  }
  $('end-title').textContent = title;
  $('end-title').className = cls;
  $('end-a').textContent = '日均 ' + p.avg.toFixed(0) + ' 签 · 盈余 ' + money(S.cash - L.start);
  $('end-b').textContent = GAPS.length + ' 个数字，' + filled + ' 个是你亲手拿的';
  $('end-quote').textContent = '「' + quote + '」';
}

/* ─── 复盘 ─── */
function renderRecap() {
  const errs = S.errors.map((e, i) => ({ w: i + 1, e })).filter((x) => x.e != null);
  if (errs.length >= 2) $('rc-head').textContent = '预测误差 ' + errs[0].e + '% → ' + errs[errs.length - 1].e + '%';
  else if (errs.length === 1) $('rc-head').textContent = '预测误差 ±' + errs[0].e + '%';
  else $('rc-head').textContent = '没有出摊对照，没有误差记录';

  $('rc-chart').innerHTML = errs.map((x) =>
    '<div class="rc-row"><span class="w">第' + x.w + '周</span>' +
    '<span class="rc-track"><span class="rc-fill ' + (x.e > 30 ? 'hi' : x.e <= 15 ? 'lo' : '') +
    '" style="width:' + Math.min(100, x.e) + '%"></span></span>' +
    '<span class="v">±' + x.e + '%</span></div>').join('');

  const fh = S.fcHistory, bh = S.betHistory, dh = S.demandHistory;
  if (!bh.length) { $('rc-curve').textContent = '（没有押注记录）'; return; }
  const rowFc   = '军师  ' + fh.map((v) => String(v).padStart(3, ' ')).join(' ');
  const rowBet  = '押注  ' + bh.map((v) => String(v).padStart(3, ' ')).join(' ');
  const rowDem  = '需求  ' + dh.map((v) => String(v).padStart(3, ' ')).join(' ');
  const rowMark = '      ' + bh.map((v, i) => {
    if (v === 0) return ' · ';
    if (v > dh[i]) return ' ↓ ';   // 押多了
    if (v < dh[i]) return ' ↑ ';   // 押少了
    return ' = ';
  }).join('');
  $('rc-curve').textContent = rowFc + '\n' + rowBet + '\n' + rowDem + '\n' + rowMark;

  $('rc-marks').innerHTML = S.milestones.length
    ? S.milestones.map((m) => '<li>' + m + '</li>').join('')
    : '<li>这 28 天风平浪静。</li>';
}

/* ─── 渲染 ─── */
function show(id) {
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === id));
  window.scrollTo(0, 0);
}

function renderMain() {
  const w = Math.min(4, Math.ceil(S.day / 7));
  const p = progress();
  $('h-day').innerHTML = '第 <b>' + S.day + '</b> 天 · 第 <b>' + w + '</b> 周';
  $('h-cash').innerHTML = '现金 <b>' + money(S.cash) + '</b>';
  $('h-avg').textContent = '日均 ' + p.avg.toFixed(0) + ' / ' + L.target;
  const fill = $('h-fill');
  fill.style.width = Math.min(100, (p.avg / L.target) * 100) + '%';
  fill.className = 'fill' + (p.avg >= L.target ? ' on' : p.avg >= L.target * 0.85 ? ' mid' : '');
  renderScene();
  renderMentors();
  renderPanels();
  renderBar();
}

function renderScene() {
  $('sc-weather').textContent = '夜市 · ' + S.weather;
  const cal = CAL_EVENTS[S.day];
  if (cal) { $('sc-cal').textContent = '📅 ' + cal; $('sc-cal').style.display = 'block'; }
  else { $('sc-cal').style.display = 'none'; }

  const rain = $('sc-rain');
  if (S.weather === '小雨') { rain.style.display = 'block'; rain.className = 'rain'; }
  else if (S.weather === '暴雨') { rain.style.display = 'block'; rain.className = 'rain heavy'; }
  else { rain.style.display = 'none'; }

  const gr = $('sc-guests');
  gr.innerHTML = '';
  for (let i = 0; i < S.guests; i++) {
    const d = document.createElement('i');
    d.className = 'guest' + (i % 2 ? ' b' : '');
    gr.appendChild(d);
  }
  $('sc-rival').style.display = S.day >= 15 ? 'block' : 'none';

  const sk = $('sc-skewers');
  if (S.phase === 'bet' || !S.stall) {
    sk.classList.add('empty');
    sk.style.height = '44px';
  } else {
    sk.classList.remove('empty');
    const ratio = Math.min(1, S.stall.sold / Math.max(1, S.stall.amount));
    sk.style.height = Math.max(8, Math.round(44 * (1 - ratio))) + 'px';
  }

  const r = S.lastResult;
  let note;
  if (S.phase === 'bet') {
    note = S.day === 1 ? '今天做什么，你定。' : '今天押多少，你定。';
  } else if (r && r.kind === 'stall') {
    note = '押 ' + r.bet + ' · 需 ' + r.demand + ' · 售 ' + r.sold +
      (r.shortage ? ' · 断货 ' + r.shortage : (r.leftover ? ' · 剩 ' + r.leftover : ''));
  } else if (r) {
    note = r.text;
  } else {
    note = '今天做什么，你定。';
  }
  $('sc-note').textContent = note;
}

function renderMentors() {
  const adv = $('adv-line');
  const old = $('old-line');

  if (S.day === 1) {
    adv.innerHTML = '日均 150，没问题！我这版模型很稳。今天先押 <em>160</em>，我给你打个样。';
    old.textContent = '二十年了，这街的生意我一眼能看出来。你先跟着 AI 走一步。';
    return;
  }
  if (S.day === 3) {
    adv.innerHTML = '这几个数我是编的。你去隔壁摊数一晚，我才能算准。';
    old.textContent = '他那几个数虚得很。明天早上菜市场蹲一小时，比什么都强。';
    return;
  }
  if (S.cash < 3000) {
    adv.innerHTML = '现金快见底了，别再花钱探店，先押小一点回血。';
    old.textContent = '你这摊子快不行了。实在不行，从我这儿借锅底，别再乱花钱。';
    return;
  }
  if (S.priceCut) {
    adv.innerHTML = '跟降的账迟早要还----你看，老客已经在走了。';
    old.textContent = '降价？我摆了二十年，没见过跟降价能长久的。';
    return;
  }

  const f = forecast();
  let s = '今晚 <em>' + f.v + '±' + f.u + '</em>';
  const missing = [];
  if (!g('price').filled) missing.push('价格带');
  if (!g('crowd').filled) missing.push('翻台率');
  if (!g('broth').filled) missing.push('底料');
  if (!g('mix').filled) missing.push('品类');
  if (missing.length) s += '。<span class="guessed">' + missing.join(' / ') + '----我还在猜。</span>';
  else s += '。每个数都是你亲手拿的。';
  adv.innerHTML = s;

  if (S.oldGuess == null) S.oldGuess = oldMasterEstimate();
  const og = S.oldGuess;
  const guessCls = og > f.v + 10 ? '（比 AI 高）' : og < f.v - 10 ? '（比 AI 低）' : '';
  old.innerHTML = '我看今晚 <b>' + og + '</b> 上下' + (guessCls ? '<span class="mut">' + guessCls + '</span>' : '') +
    '。<span class="guessed">别的不敢说，这条街的人几点来我清楚。</span>';
}

function renderPanels() {
  const phase = S.phase;
  $('phase-bet').style.display = phase === 'bet' ? 'block' : 'none';
  $('phase-result').style.display = phase === 'result' ? 'block' : 'none';

  if (phase === 'bet') {
    const f = forecast();
    // 军师区间大字
    $('b-fc').textContent = f.v + '±' + f.u;

    // 情报行
    const parts = [];
    parts.push('天气 <b>' + S.weather + '</b>');
    const cal = CAL_EVENTS[S.day];
    if (cal) parts.push('日历 <b>' + cal + '</b>');
    const filled = filledCount();
    parts.push('已实测 <b>' + filled + '/' + GAPS.length + '</b>');
    $('b-intel').innerHTML = parts.join(' · ');

    // 四档：区间覆盖高亮
    const lo = f.v - f.u, hi = f.v + f.u;
    document.querySelectorAll('.bet-btn').forEach((b) => {
      const amt = Number(b.dataset.amount);
      const inRange = amt >= lo && amt <= hi;
      b.classList.toggle('covered', inRange);
      const cost = amt * L.unitCost;
      b.disabled = S.cash < cost;
    });

    // 定价滑杆
    const pv = (L.priceBase * S.priceMultiplier).toFixed(1);
    $('p-val').textContent = pv;
    $('p-slider').value = Math.round(S.priceMultiplier * 100);
    if (g('price').filled) {
      $('p-ref').textContent = '本地均价 ' + L.localAvg.toFixed(1) + ' 元';
      $('p-ref').className = 'ok';
      // 显示本地均价标记：3.2 / 3.0 → 106.7%
      const pct = (L.localAvg / L.priceBase) * 100;
      const pctInRange = Math.max(0, Math.min(100, (pct - 70) / 60 * 100));
      $('p-mark').style.display = 'block';
      $('p-mark').style.left = pctInRange + '%';
    } else {
      $('p-ref').textContent = '本地价格带：未知';
      $('p-ref').className = 'mut';
      $('p-mark').style.display = 'none';
    }

    // 不押按钮
    $('b-skip').textContent = '今天不押 · 亏 ' + money(L.fixed) + ' 固定成本，去拿个数';
    $('b-skip').disabled = S.day === 1;
  }

  if (phase === 'result') {
    const st = S.stall;
    if (st) {
      $('r-attrs').style.display = 'grid';
      $('r-bet').textContent = st.amount;
      $('r-demand').textContent = st.demand;
      $('r-left').textContent = Math.max(0, st.leftover);
      $('r-left-box').className = st.leftover > 0 ? 'lose' : 'win';

      // 军师对照
      const f = { v: st.fc, u: unc() };
      const diff = st.amount - st.fc;
      let cmp = '军师说 <b>' + f.v + '±' + f.u + '</b>。';
      if (Math.abs(diff) <= f.u) {
        cmp += '你押在了区间内。<span class="good">跟军师同调。</span>';
      } else if (diff > 0) {
        cmp += '你比军师多押了 <b>' + diff + '</b> 签。<span class="warn">赌了一把大的。</span>';
      } else {
        cmp += '你比军师少押了 <b>' + Math.abs(diff) + '</b> 签。<span class="warn">保守了一把。</span>';
      }
      $('r-compare').innerHTML = cmp;

      const netCls = st.net >= 0 ? 'good' : 'bad';
      let detail = '';
      if (st.shortage > 0) detail += '<span class="bad">断货 ' + st.shortage + ' 签</span> · ';
      if (st.leftover > 0) detail += '损耗 <span class="bad">' + (st.wasteRate * 100).toFixed(0) + '%</span> · ';
      detail += '流水 <span class="num">' + money(st.rev) + '</span> · 净 <span class="' + netCls + '">' + money(st.net) + '</span>';
      if (st.fine) detail += '<br><span class="bad">损耗超线，罚款 ' + money(st.fine) + '</span>';
      $('r-detail').innerHTML = detail;
    } else {
      $('r-attrs').style.display = 'none';
      $('r-compare').innerHTML = '';
      $('r-detail').innerHTML = (S.lastResult && S.lastResult.text) ? S.lastResult.text : '今天没有出摊。';
    }
  }

  $('b-next').textContent = S.day >= 28 ? '收摊 · 查看结局' : '收摊 · 进入第 ' + (S.day + 1) + ' 天';

  $('hint').textContent = S.day === 1
    ? '军师：今天先押 160，我给你打个样。'
    : (S.phase === 'bet'
        ? '押注当场扣原料钱。区间内的档位 = 军师建议区间。'
        : '这一注已经开奖，收摊继续。');
}

function renderBar() {
  const left = GAPS.filter((x) => !g(x.key).filled).length;
  $('tab-gaps').textContent = '缺口（' + left + '）';
}

function renderLedger() {
  const net = S.cum.rev - S.cum.cost;
  $('ld-body').innerHTML =
    row('累计流水', money(S.cum.rev)) +
    row('累计经营成本', money(S.cum.cost)) +
    row('累计净赚', money(net)) +
    row('行动支出', money(S.cum.act)) +
    row('事件与罚息', money(S.cum.event)) +
    '<div class="srow total"><span>现金</span><span class="num">' + money(S.cash) + '</span></div>' +
    '<div class="logs">' + S.logs.slice(0, 8).map((l) =>
      '<div class="log ' + l.cls + '"><span>D' + l.day + '</span>' + l.text + '</div>').join('') +
    '</div>';
}

function renderGaps() {
  $('gp-body').innerHTML = GAPS.map((x) => {
    const gp = g(x.key);
    let right;
    if (gp.filled) right = '<span class="ok">' + gp.val + '</span>';
    else if (x.src === '自动') right = '<span class="mut">第一周结算回填</span>';
    else right = '<span class="mut">' + x.src + '</span>';
    const state = gp.filled ? '已实测' : (x.src === '自动' ? '待回填' : '军师在猜 · 影响预测 ±' + unc() + '%');
    return '<div class="grow"><div><b>' + x.label + '</b><small class="mut">' + state + '</small></div>' + right + '</div>';
  }).join('');
}

function closeSheets() {
  $('sh-ledger').classList.remove('on');
  $('sh-gaps').classList.remove('on');
}
function toggleSheet(id) {
  const el = $(id);
  const on = el.classList.contains('on');
  closeSheets();
  if (!on) {
    if (id === 'sh-ledger') renderLedger();
    else renderGaps();
    el.classList.add('on');
  }
}

/* ─── 启动 ─── */
function newGame() {
  reset();
  show('pg-open');
}

$('b-start').onclick = () => {
  S.phase = 'bet';
  S.oldGuess = oldMasterEstimate();
  show('pg-main');
  renderMain();
};
document.querySelectorAll('.bet-btn').forEach((b) => {
  b.onclick = () => doBet(Number(b.dataset.amount));
});
$('b-skip').onclick = doSkip;
$('b-next').onclick = nextDay;

// 定价滑杆
$('p-slider').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  S.priceMultiplier = v / 100;
  if (S.phase === 'bet') renderPanels();
});

$('tab-ledger').onclick = () => toggleSheet('sh-ledger');
$('tab-gaps').onclick = () => toggleSheet('sh-gaps');
document.querySelectorAll('button[data-close]').forEach((b) => {
  b.onclick = () => $(b.dataset.close).classList.remove('on');
});
$('b-wk').onclick = weeklyNext;
$('b-recap').onclick = () => { renderRecap(); show('pg-recap'); };
$('b-again1').onclick = newGame;
$('b-again2').onclick = newGame;

reset();
show('pg-open');
</script>
</body>
</html>
