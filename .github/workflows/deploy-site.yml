# 发布站点：向 main 分支提交时，构建 Vite 产物并上传到 OSS 发布桶
#（qtgame-tycoon-site，静态网站托管），并刷新 CDN 缓存。不接受手动触发。
#
# 部署链路（对齐 qtfounder 的 deploy-site.yml 模式）：
#   main 提交 → Actions（npm ci + build，ossutil cp）→ OSS 桶（qtgame-tycoon-site）
#   → CDN（tycoon.game.quanttide.com）→ 用户浏览器
#
# 构建说明：React + Vite 单页应用，产物 dist/ 为 index.html + 哈希 assets/；
# 缓存策略：哈希资源长缓存，固定名入口（index.html / 404.html）必须 no-cache，
# 否则发版后浏览器/CDN 拿旧 HTML（引用旧 hash）。
#
# 前置条件（均已在 CI 之外用 aliyun CLI 配置完成，模式见 quanttide-platform 的
# static-site / cdn-auth 模块）：
#   - OSS 桶 qtgame-tycoon-site：私有 + 静态网站托管（默认首页 index.html，错误页 404.html）
#   - CDN 域名 tycoon.game.quanttide.com：源站回该桶（oss:80），l2_oss_key 私有回源
#     （private_oss_auth=on，角色 AliyunCDNAccessingPrivateOSSRole），另配 https_force
#     与 back_to_origin_url_rewrite（/ 及未知路径 → /index.html）
#   - 证书 *.game.quanttide.com（Let's Encrypt，本机 acme.sh 签发；
#     ~/.acme.sh/deploy-cdn-cert-tycoon.sh 作为 reloadcmd 在续期时自动重新绑定）
#   - DNS：quanttide.com 下 tycoon.game CNAME → *.w.kunlunaq.com
#
# 所需 GitHub secrets：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET（secret）：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）

name: Deploy Site

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-qtgame-tycoon-site
  cancel-in-progress: true

env:
  OSS_BUCKET: qtgame-tycoon-site
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: tycoon.game.quanttide.com

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 哈希资源（assets/）文件名含内容指纹，可永久缓存
      - name: Upload assets（长缓存）
        run: |
          ossutil cp dist/assets/ oss://${{ env.OSS_BUCKET }}/assets/ -r -f \
            --meta "Cache-Control:public,max-age=31536000"

      # 入口页固定名，必须 no-cache，否则发版后浏览器/CDN 拿旧 HTML
      - name: Upload index.html（no-cache）
        run: |
          ossutil cp dist/index.html oss://${{ env.OSS_BUCKET }}/index.html -f --meta "Cache-Control:no-cache"

      # 错误页兜底：OSS 静态托管 error_document 返回 404.html
      - name: Upload 404.html（fallback）
        run: |
          cp dist/index.html 404.html
          ossutil cp 404.html oss://${{ env.OSS_BUCKET }}/404.html -f --meta "Cache-Control:no-cache"

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
